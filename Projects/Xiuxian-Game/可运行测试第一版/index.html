<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>修仙世界记录簿</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-viewport">
      <!-- 顶部全局轻量导航栏 -->
      <header class="app-header">
        <div class="header-brand">
          <span class="game-logo">仙途</span>
          <h1 class="game-title">修仙世界记录簿</h1>
        </div>

        <div id="app-message" role="status" class="header-message"></div>

        <div class="header-right">
          <!-- 右上角小巧状态与游戏时钟 -->
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-label">当前状态:</span>
            <span id="status-title" class="status-text">正在闭关</span>
          </div>
          <div class="chip" id="current-date">游戏日期待设定</div>

          <!-- 系统抽屉开关按钮 -->
          <button id="open-drawer-btn" type="button" class="drawer-toggle-btn" title="系统、存档与天道推演">
            ⚙️ 系统与天道
          </button>
        </div>
      </header>

      <!-- 三栏主视图（左侧栏 + 中间主舞台 + 右侧滑出抽屉） -->
      <div class="app-workspace">
        <!-- 左侧 Taskbar：人物状态、属性、背包与人际关系 -->
        <aside class="left-sidebar">
          <div id="character-card" class="character-panel"></div>
        </aside>

        <!-- 中间核心游玩舞台 -->
        <main class="main-stage">
          <!-- 历程纪事（正文事件记录） -->
          <section class="panel story-panel">
            <div class="story-scroll-container">
              <div id="story-log" class="story-log"></div>
            </div>
          </section>

          <!-- 分界装饰线 -->
          <div class="section-divider">
            <span class="divider-line"></span>
            <span class="divider-title">何 去 何 从</span>
            <span class="divider-line"></span>
          </div>

          <!-- 中间正下方：8 大行动选项与推演控制台 -->
          <section class="panel actions-panel">
            <div id="action-buttons"></div>
          </section>
        </main>

        <!-- 右侧滑出式窗口：系统设置、存档管理、天道推演 -->
        <aside id="system-drawer" class="right-drawer" hidden>
          <div class="drawer-header">
            <h2>天道神机与系统</h2>
            <button id="close-drawer-btn" type="button" class="drawer-close-btn" aria-label="关闭">✕</button>
          </div>
          <div class="drawer-body">
            <!-- 快捷开局 -->
            <section class="drawer-section">
              <h3>⚡ 快捷启程</h3>
              <button id="quick-character-btn" type="button" class="action-btn-gold">
                新手开局：一键生成散修角色
              </button>
            </section>

            <!-- 存档管理 -->
            <section class="drawer-section save-panel">
              <h2>💾 存档管理</h2>
              <div class="save-btn-grid">
                <button id="save-button" type="button">保存当前进度</button>
                <button id="load-button" type="button">加载本地存档</button>
                <button id="reset-button" type="button">重置当前角色</button>
              </div>
            </section>

            <!-- 天道推演（原外部大模型工具） -->
            <section class="drawer-section ai-panel">
              <h2>📜 天道推演（深度交互模式）</h2>
              <p class="small-text">
                单机状态下直接点击行动面板的【⚡ 运转天道】即可推演；如需借由外部神机（ChatGPT / Claude / Gemini）撰写长篇剧情，可于此处复制提示词并填回天机 JSON。
              </p>
              <textarea id="ai-prompt" readonly></textarea>
              <button id="copy-prompt" type="button">复制天道提示词</button>
            </section>
          </div>
        </aside>
      </div>
    </div>

    <!-- 抽屉遮罩层 -->
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
